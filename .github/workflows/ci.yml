name: CI
on: [push, pull_request]
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: runtime
        with:
          path: resources/windows/runtime
          key: windows-lpac-node-24.22.1-x64-${{ hashFiles('scripts/build-windows-runtime.ps1', 'resources/windows/libuv-appcontainer.patch') }}
      - name: Build private runtime with upstream AppContainer pipe fix
        if: steps.runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-runtime.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lpac-runtime
          path: resources/windows/runtime
          if-no-files-found: error
  test:
    needs: windows-runtime
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-lpac-runtime
          path: resources/windows/runtime
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/test-windows-diagnostics.cjs
      - name: Windows cold/warm startup and child-pipe diagnostics
        if: runner.os == 'Windows' && matrix.node == 22
        run: node scripts/diagnose-windows.cjs --extension . --output windows-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && matrix.node == 22
        with:
          name: windows-diagnostics-${{ matrix.os }}
          path: windows-diagnostics.json
          if-no-files-found: warn
      - run: npm run test:sandbox
        if: runner.os == 'macOS' || runner.os == 'Windows'
      - name: Confined Windows CLI installation/version smoke (no sign-in or model call)
        if: runner.os == 'Windows' && matrix.node == 22
        run: node dist/test/checkManagedNetwork.js
        env:
          AI_FILE_GUARD_CLI_SMOKE: '1'
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'
      - run: npm run package
      - run: npm run package:release -- --out candidate.vsix
        if: runner.os != 'Linux'
      - name: Verify stable channel and package identity
        if: runner.os != 'Linux'
        shell: python
        run: |
          import hashlib, json, pathlib, xml.etree.ElementTree as ET, zipfile
          package = pathlib.Path('candidate.vsix')
          metadata = json.loads(pathlib.Path('candidate.vsix.json').read_text())
          expected = json.loads(pathlib.Path('package.json').read_text())
          assert metadata['preRelease'] is False
          assert hashlib.sha256(package.read_bytes()).hexdigest() == metadata['sha256']
          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read('extension/package.json'))
              assert manifest['preview'] is False
              assert manifest['version'] == expected['version']
              assert manifest['homepage'] == expected['homepage'] == 'https://github.com/ravi6565'
              assert 'bugs' not in manifest and 'repository' not in manifest
              assert manifest['publisher'] == 'ravikiranv'
              assert manifest['name'] == 'ai-file-guard'
              xml = ET.fromstring(archive.read('extension.vsixmanifest'))
              ns = {'v': 'http://schemas.microsoft.com/developer/vsx-schema/2011'}
              identity = xml.find('v:Metadata/v:Identity', ns)
              assert identity.attrib['Version'] == expected['version']
              assert identity.attrib['TargetPlatform'] == metadata['target']
              assert 'Preview' not in xml.findtext('v:Metadata/v:GalleryFlags', '', ns)
              properties = {p.attrib['Id']: p.attrib.get('Value') for p in xml.findall('.//v:Property', ns)}
              assert properties.get('Microsoft.VisualStudio.Code.PreRelease', 'false') == 'false'
              links = {key: value for key, value in properties.items() if key.startswith('Microsoft.VisualStudio.Services.Links.')}
              assert links == {'Microsoft.VisualStudio.Services.Links.Learn': expected['homepage']}, links
          print('Stable channel, identity, target and checksum verified.')
      - run: npm run test:vsix -- candidate.vsix
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: installed-candidate-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            candidate.vsix
            candidate.vsix.sha256
            candidate.vsix.json
          if-no-files-found: error
