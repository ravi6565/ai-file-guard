name: CI
on: [push, pull_request]
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: runtime
        with:
          path: resources/windows/runtime
          key: windows-lpac-node-24.22.1-x64-${{ hashFiles('scripts/build-windows-runtime.ps1', 'resources/windows/libuv-appcontainer.patch') }}
      - name: Build private runtime with upstream AppContainer pipe fix
        if: steps.runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-windows-runtime.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lpac-runtime
          path: resources/windows/runtime
          if-no-files-found: error
  test:
    needs: windows-runtime
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-lpac-runtime
          path: resources/windows/runtime
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:sandbox
        if: runner.os == 'macOS' || runner.os == 'Windows'
      - name: Confined Windows CLI installation/version smoke (no sign-in or model call)
        if: runner.os == 'Windows' && matrix.node == 22
        run: node dist/test/checkManagedNetwork.js
        env:
          AI_FILE_GUARD_CLI_SMOKE: '1'
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'
      - run: npm run package
      - run: npm run package:preview -- --out candidate.vsix
        if: runner.os != 'Linux'
      - run: npm run test:vsix -- candidate.vsix
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: installed-candidate-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            candidate.vsix
            candidate.vsix.sha256
            candidate.vsix.json
          if-no-files-found: error
