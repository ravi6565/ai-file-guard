name: CI
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:sandbox
        if: runner.os == 'macOS' || runner.os == 'Windows'
      - run: xvfb-run -a npm run test:integration
        if: runner.os == 'Linux'
      - run: npm run test:integration
        if: runner.os != 'Linux'
      - run: npm run package
      - run: npm run package:preview -- --out candidate.vsix
        if: runner.os != 'Linux'
      - run: npm run test:vsix -- candidate.vsix
        if: runner.os != 'Linux'
